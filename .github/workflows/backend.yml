name: Backend CI

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intel
          POSTGRES_PASSWORD: intel
          POSTGRES_DB: intel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intel" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Tests on SQLite
        run: pytest -q
      - name: Migrations on Postgres
        env:
          DATABASE_URL: postgresql+psycopg://intel:intel@localhost:5432/intel
        run: alembic upgrade head && alembic downgrade base
      - name: Tests on Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://intel:intel@localhost:5432/intel
        run: pytest -q
