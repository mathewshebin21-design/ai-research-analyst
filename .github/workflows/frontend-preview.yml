name: Frontend preview CI

on:
  pull_request:
    paths: ["frontend-preview/**", ".github/workflows/frontend-preview.yml"]
  push:
    branches: [main]
    paths: ["frontend-preview/**", ".github/workflows/frontend-preview.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-preview/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
