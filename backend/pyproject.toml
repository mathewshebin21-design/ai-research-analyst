[project]
name = "intel"
version = "0.1.0"
description = "Strategic Intelligence Hub research API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "pypdf>=4.2",
  "reportlab>=4.2",
  "google-genai>=1.0",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.1",
  "email-validator>=2.1",
  "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intel*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"eval/*" = ["S"]
"migrations/*" = ["UP", "E501", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
